name: Build JSON EPG Demo

on:
  workflow_dispatch: # Manual trigger for testing

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy-demo:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Fast XML Parser
        run: npm install fast-xml-parser

      - name: Download & Extract Existing XML
        run: |
          echo "Downloading Tata Play XML from live site..."
          wget https://epg.goveloz.me/tataplay.xml.gz -O tataplay.xml.gz
          gunzip tataplay.xml.gz

      - name: Convert to JSON
        run: node convert.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
