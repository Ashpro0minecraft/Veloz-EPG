<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veloz TV Guide</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: var(--accent);
            margin-bottom: 30px;
        }
        .epg-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .channel-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .channel-header {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
        }
        .channel-logo {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: contain;
            background: #fff;
            padding: 4px;
        }
        .channel-name {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .program {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .program-time {
            color: var(--accent);
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }
        .program-title {
            font-weight: 600;
        }
        /* Hide element if empty */
        .hidden { display: none; }
    </style>
</head>
<body>

    <h1>Veloz TV Guide (Tata Play)</h1>
    <div id="epg-grid" class="epg-container">
        <p style="text-align:center; width:100%;">Loading EPG Data...</p>
    </div>

    <script>
        // Formats XMLTV date (20261110053000 +0530) to readable 12hr time
        function formatTime(xmlTime) {
            if (!xmlTime) return '';
            const y = xmlTime.substring(0,4);
            const m = xmlTime.substring(4,6) - 1;
            const d = xmlTime.substring(6,8);
            const h = xmlTime.substring(8,10);
            const min = xmlTime.substring(10,12);
            
            const date = new Date(y, m, d, h, min);
            return date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        async function loadEPG() {
            try {
                // Fetch the JSON file generated by your GitHub Action
                const response = await fetch('epg.json');
                const data = await response.json();
                
                const grid = document.getElementById('epg-grid');
                grid.innerHTML = ''; // Clear loading text

                // Loop through first 50 channels for the demo to prevent lag
                data.slice(0, 50).forEach(channel => {
                    if(channel.programs.length === 0) return; // Skip empty channels
                    
                    const card = document.createElement('div');
                    card.className = 'channel-card';
                    
                    // Add Channel Header
                    let html = `
                        <div class="channel-header">
                            <img src="${channel.logo}" alt="Logo" class="channel-logo" onerror="this.src='https://via.placeholder.com/60?text=TV'">
                            <div class="channel-name">${channel.name}</div>
                        </div>
                    `;
                    
                    // Add first 3 programs for this channel
                    const recentPrograms = channel.programs.slice(0, 3);
                    recentPrograms.forEach(prog => {
                        html += `
                            <div class="program">
                                <div class="program-time">${formatTime(prog.start)} - ${formatTime(prog.stop)}</div>
                                <div class="program-title">${prog.title}</div>
                            </div>
                        `;
                    });

                    card.innerHTML = html;
                    grid.appendChild(card);
                });
            } catch (error) {
                document.getElementById('epg-grid').innerHTML = '<p>Error loading guide data. Ensure the Action has run successfully.</p>';
                console.error("Fetch error:", error);
            }
        }

        // Initialize
        loadEPG();
    </script>
</body>
</html>
