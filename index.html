<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veloz-EPG</title>
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* --- MODERN CLEAN UI VARIABLES --- */
        :root {
            --veloz-bg: #09090b;        
            --veloz-card-bg: #18181b;
            --veloz-border: #27272a;
            --veloz-blue: #3B82F6;      
            --veloz-green: #10B981;
            --veloz-text: #f4f4f5;
            --veloz-muted: #a1a1aa;
        }

        body {
            background-color: var(--veloz-bg);
            color: var(--veloz-text);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- NAVBAR --- */
        .navbar {
            background: rgba(9, 9, 11, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--veloz-border);
        }
        
        .logo-img {
            height: 40px;
            width: auto;
        }

        /* --- HEADER SECTION --- */
        .header-section {
            padding: 60px 0 40px 0;
            text-align: center;
        }

        .page-title {
            font-weight: 800;
            font-size: 2.5rem;
            letter-spacing: -1px;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .repo-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--veloz-card-bg);
            border: 1px solid var(--veloz-border);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            color: var(--veloz-muted);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--veloz-green);
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* --- LINK CARDS --- */
        .epg-container {
            flex: 1;
            max-width: 700px;
            margin: 0 auto;
            width: 100%;
            padding: 0 20px;
        }

        .link-card {
            background-color: var(--veloz-card-bg);
            border: 1px solid var(--veloz-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .link-card:hover {
            border-color: #3f3f46;
        }

        .provider-info {
            display: flex;
            align-items: center;
            gap: 16px;
            overflow: hidden;
        }

        .provider-icon {
            font-size: 1.5rem;
            color: var(--veloz-text);
            background: #27272a;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            flex-shrink: 0;
        }

        .provider-details h5 {
            margin: 0 0 4px 0;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .provider-details code {
            font-family: 'JetBrains Mono', monospace;
            color: var(--veloz-muted);
            font-size: 0.85rem;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Copy Button */
        .btn-copy {
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            flex-shrink: 0;
            margin-left: 15px;
        }

        .btn-copy:hover {
            background-color: #e4e4e7;
            transform: translateY(-1px);
        }

        .btn-copy.copied {
            background-color: var(--veloz-green);
            color: #ffffff;
        }

        /* --- FOOTER --- */
        footer {
            padding: 30px 0;
            border-top: 1px solid var(--veloz-border);
            font-size: 0.9rem;
            color: var(--veloz-muted);
            margin-top: 40px;
        }

        @media (max-width: 576px) {
            .link-card {
                flex-direction: column;
                align-items: stretch;
                gap: 15px;
            }
            .btn-copy {
                margin-left: 0;
                justify-content: center;
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar sticky-top">
        <div class="container d-flex justify-content-center">
            <a class="navbar-brand p-0" href="#">
                <img src="/logo-header.svg" alt="Veloz Innovations" class="logo-img" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMjAiIGhlaWdodD0iNDAiPjx0ZXh0IHk9IjI1IiBmaWxsPSIjZmZmIiBmb250LWZhbWlseT0ic2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZm9udC13ZWlnaHQ9ImJvbGQiPlZFTE9aPC90ZXh0Pjwvc3ZnPg=='">
            </a>
        </div>
    </nav>

    <header class="header-section">
        <div class="container">
            <h1 class="page-title">Veloz-EPG</h1>
            <p class="text-muted mb-4">Direct XMLTV EPG sources for your media servers.</p>
            
            <div class="repo-status">
                <div class="pulse-dot"></div>
                <span>Last Updated: <strong id="update-time">Fetching...</strong></span>
            </div>
        </div>
    </header>

    <main class="epg-container">
        
        <!-- DishTV Card -->
        <div class="link-card">
            <div class="provider-info">
                <div class="provider-icon">
                    <i class="bi bi-broadcast"></i>
                </div>
                <div class="provider-details">
                    <h5>Dish TV</h5>
                    <code>https://epg.goveloz.me/dishtv.xml.gz</code>
                </div>
            </div>
            <button class="btn-copy" onclick="copyText('https://epg.goveloz.me/dishtv.xml.gz', this)">
                <i class="bi bi-copy"></i> Copy
            </button>
        </div>

        <!-- TataPlay Card -->
        <div class="link-card">
            <div class="provider-info">
                <div class="provider-icon">
                    <i class="bi bi-tv"></i>
                </div>
                <div class="provider-details">
                    <h5>Tata Play</h5>
                    <code>https://epg.goveloz.me/tataplay.xml.gz</code>
                </div>
            </div>
            <button class="btn-copy" onclick="copyText('https://epg.goveloz.me/tataplay.xml.gz', this)">
                <i class="bi bi-copy"></i> Copy
            </button>
        </div>

        <!-- Airtel Card -->
        <div class="link-card">
            <div class="provider-info">
                <div class="provider-icon">
                    <i class="bi bi-router"></i>
                </div>
                <div class="provider-details">
                    <h5>Airtel Digital TV</h5>
                    <code>https://epg.goveloz.me/airtel.xml.gz</code>
                </div>
            </div>
            <button class="btn-copy" onclick="copyText('https://epg.goveloz.me/airtel.xml.gz', this)">
                <i class="bi bi-copy"></i> Copy
            </button>
        </div>

    </main>

    <footer>
        <div class="container text-center">
            <p class="mb-0">© 2026 Veloz Innovations Pvt. Ltd</p>
        </div>
    </footer>

    <script>
        // Copy to clipboard functionality
        function copyText(text, buttonElement) {
            navigator.clipboard.writeText(text).then(() => {
                const originalHTML = buttonElement.innerHTML;
                buttonElement.innerHTML = '<i class="bi bi-check2-all"></i> Copied';
                buttonElement.classList.add('copied');
                
                setTimeout(() => {
                    buttonElement.innerHTML = originalHTML;
                    buttonElement.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy text: ', err);
                buttonElement.innerHTML = '<i class="bi bi-x-circle"></i> Failed';
                setTimeout(() => {
                    buttonElement.innerHTML = '<i class="bi bi-copy"></i> Copy';
                }, 2000);
            });
        }

        // Fetch last repository push date from GitHub API
        async function fetchRepoData() {
            const repoUrl = 'https://api.github.com/repos/Ashpro0minecraft/Veloz-EPG';
            const dateElement = document.getElementById('update-time');
            
            try {
                const response = await fetch(repoUrl);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                const pushDate = new Date(data.pushed_at);
                
                // Format the date (e.g., "August 13, 2026 at 09:30 PM")
                const options = { 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric',
                    hour: '2-digit', 
                    minute: '2-digit'
                };
                
                dateElement.textContent = pushDate.toLocaleDateString('en-US', options);
            } catch (error) {
                console.error('Error fetching repo data:', error);
                dateElement.textContent = 'Status Unavailable';
            }
        }

        // Run fetch on load
        window.addEventListener('DOMContentLoaded', fetchRepoData);
    </script>
</body>
</html>
